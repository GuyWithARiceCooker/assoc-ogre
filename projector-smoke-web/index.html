<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>4 projektor fustben - mobil WebGL demo</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #05070d;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
    }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
    #hud {
      position: fixed;
      left: max(10px, env(safe-area-inset-left));
      right: max(10px, env(safe-area-inset-right));
      top: max(8px, env(safe-area-inset-top));
      color: #dfe8ff;
      background: rgba(5,8,16,.58);
      border: 1px solid rgba(180,210,255,.18);
      border-radius: 12px;
      padding: 10px 12px;
      max-width: 520px;
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
    #hud h1 { font-size: 16px; margin: 0 0 5px; }
    #hud p { margin: 4px 0; line-height: 1.25; font-size: 12px; color: #b9c7de; }
    #hud b { color: #fff3a2; }
    #hud .keys { color: #8be7ff; }
    #controls {
      position: fixed;
      left: max(10px, env(safe-area-inset-left));
      right: max(10px, env(safe-area-inset-right));
      bottom: max(10px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      z-index: 5;
    }
    button {
      border: 1px solid rgba(150, 210, 255, .28);
      background: rgba(8, 14, 28, .78);
      color: #dcecff;
      border-radius: 12px;
      padding: 10px 8px;
      font: 600 12px/1 system-ui, sans-serif;
      min-height: 42px;
      box-shadow: 0 4px 18px rgba(0,0,0,.28);
    }
    button.active { background: rgba(71, 128, 255, .58); border-color: rgba(180,220,255,.72); color: white; }
    #badge {
      position: fixed;
      right: max(10px, env(safe-area-inset-right));
      top: max(10px, env(safe-area-inset-top));
      color: #9db0ca;
      font-size: 11px;
      background: rgba(5,8,16,.48);
      padding: 7px 9px;
      border-radius: 10px;
      pointer-events: none;
    }
    @media (max-width: 720px) {
      #hud { max-width: none; padding: 9px 10px; }
      #hud h1 { font-size: 14px; }
      #hud p { font-size: 11px; }
      #hud p:nth-of-type(2) { display: none; }
      #badge { display: none; }
      #controls { grid-template-columns: repeat(5, 1fr); gap: 6px; }
      button { min-height: 40px; padding: 9px 5px; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="hud">
    <h1>4 projektor + fust</h1>
    <p><b>Mobil nezet</b>: elo, gomolygo fustreszecskek telefonra optimalizalva.</p>
    <p><b>Fenyosszeadas</b>: ahol tobb projektor kepmintaja ugyanazt a fustpontot eri, ott a feny egy kozegben adodik ossze.</p>
    <p class="keys">Erintsd: Normal / Osszeg / Fustfeny / Orbit / Minoseg</p>
  </div>
  <div id="badge">mobile canvas</div>
  <div id="controls" aria-label="demo controls">
    <button data-mode="0" class="active">Normal</button>
    <button data-mode="1">Osszeg</button>
    <button data-mode="2">Fustfeny</button>
    <button id="orbitBtn" class="active">Orbit</button>
    <button id="qualityBtn">Low</button>
  </div>
  <script src="./main.js?v=mobile3"></script>
</body>
</html>
