<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Modular solar catamaran dream concept</title>
  <desc id="desc">A realistic-dreamlike concept sketch of a separable multi-hull solar catamaran at a pastel retro sunset.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9b7f4"/>
      <stop offset="0.34" stop-color="#f1b7c8"/>
      <stop offset="0.68" stop-color="#ffd08c"/>
      <stop offset="1" stop-color="#f7ecd6"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecd6bd"/>
      <stop offset="0.32" stop-color="#a9bfd0"/>
      <stop offset="1" stop-color="#526d88"/>
    </linearGradient>
    <linearGradient id="hullWhite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.46" stop-color="#dde7ef"/>
      <stop offset="1" stop-color="#7b91a5"/>
    </linearGradient>
    <linearGradient id="solarBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dffbff" stop-opacity="0.92"/>
      <stop offset="0.48" stop-color="#8ed8ef" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#526fb8" stop-opacity="0.86"/>
    </linearGradient>
    <linearGradient id="solarLavender" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1ff" stop-opacity="0.9"/>
      <stop offset="0.48" stop-color="#d8a6eb" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#6750a5" stop-opacity="0.84"/>
    </linearGradient>
    <linearGradient id="solarMint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#effff6" stop-opacity="0.9"/>
      <stop offset="0.48" stop-color="#98e9c5" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#4b9b8a" stop-opacity="0.84"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff4aa" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff9d6"/>
      <stop offset="0.55" stop-color="#ffc66c"/>
      <stop offset="1" stop-color="#ff947e" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#1e3651" flood-opacity="0.28"/>
    </filter>
    <filter id="panelGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="microGrid" width="28" height="20" patternUnits="userSpaceOnUse">
      <path d="M0 0H28M0 20H28M0 0V20M28 0V20" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1"/>
      <path d="M14 0V20" fill="none" stroke="#14324b" stroke-opacity="0.16" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <g opacity="0.32">
    <rect x="0" y="92" width="1600" height="16" fill="#f9e3a7"/>
    <rect x="0" y="140" width="1600" height="9" fill="#8f8bd6"/>
    <rect x="0" y="197" width="1600" height="13" fill="#fff1bd"/>
    <rect x="0" y="254" width="1600" height="7" fill="#d778a1"/>
    <rect x="0" y="306" width="1600" height="18" fill="#f9d0a1"/>
    <rect x="0" y="358" width="1600" height="8" fill="#8972c6"/>
    <rect x="0" y="414" width="1600" height="12" fill="#ffe1b1"/>
  </g>

  <circle cx="1184" cy="370" r="152" fill="url(#sun)" opacity="0.92"/>
  <circle cx="1184" cy="370" r="77" fill="#fff0bd" opacity="0.72"/>
  <path d="M0 535C210 493 348 527 510 502C728 468 883 525 1048 491C1249 449 1398 495 1600 462V1000H0Z" fill="url(#water)"/>

  <g opacity="0.34" fill="none" stroke-linecap="round">
    <path d="M120 621C310 599 486 603 676 620" stroke="#fff5d7" stroke-width="5"/>
    <path d="M813 645C999 622 1208 623 1394 646" stroke="#fff3d2" stroke-width="4"/>
    <path d="M144 735C346 705 569 708 765 734" stroke="#405a75" stroke-width="3"/>
    <path d="M884 789C1036 770 1212 772 1376 792" stroke="#314b66" stroke-width="3"/>
    <path d="M530 553C707 534 864 538 1017 557" stroke="#fff8dc" stroke-width="3"/>
  </g>

  <g id="catamaran" filter="url(#softShadow)">
    <ellipse cx="795" cy="780" rx="555" ry="56" fill="#243a51" opacity="0.22"/>

    <!-- Three separable light hulls -->
    <g id="hulls">
      <path d="M294 631C402 581 572 573 710 598C779 611 830 635 843 663C806 711 643 736 465 724C351 716 281 685 249 654C260 645 273 637 294 631Z" fill="url(#hullWhite)" stroke="#f9fbff" stroke-width="3"/>
      <path d="M518 684C620 647 791 643 934 670C1025 687 1085 718 1100 753C1054 797 871 820 678 804C567 795 496 760 463 728C477 710 495 696 518 684Z" fill="url(#hullWhite)" stroke="#f9fbff" stroke-width="3"/>
      <path d="M757 620C875 571 1049 568 1185 603C1264 624 1320 657 1336 692C1283 739 1102 761 915 742C802 731 724 693 690 661C707 644 729 630 757 620Z" fill="url(#hullWhite)" stroke="#f9fbff" stroke-width="3"/>
    </g>

    <!-- Transparent solar skin wrapping each module -->
    <g id="solar-skins" filter="url(#panelGlow)">
      <path d="M346 613C450 587 593 588 708 610C736 616 765 625 786 637C705 653 515 662 323 649C326 635 333 623 346 613Z" fill="url(#solarBlue)" stroke="#effcff" stroke-width="2"/>
      <path d="M548 692C663 661 822 664 960 691C994 698 1024 708 1049 722C962 741 706 749 513 728C521 713 532 702 548 692Z" fill="url(#solarLavender)" stroke="#fff5ff" stroke-width="2"/>
      <path d="M802 615C917 587 1074 591 1198 623C1230 631 1257 644 1279 660C1180 676 983 682 759 656C768 639 782 626 802 615Z" fill="url(#solarMint)" stroke="#f4fff9" stroke-width="2"/>
      <path d="M346 613C450 587 593 588 708 610C736 616 765 625 786 637C705 653 515 662 323 649C326 635 333 623 346 613Z" fill="url(#microGrid)" opacity="0.82"/>
      <path d="M548 692C663 661 822 664 960 691C994 698 1024 708 1049 722C962 741 706 749 513 728C521 713 532 702 548 692Z" fill="url(#microGrid)" opacity="0.78"/>
      <path d="M802 615C917 587 1074 591 1198 623C1230 631 1257 644 1279 660C1180 676 983 682 759 656C768 639 782 626 802 615Z" fill="url(#microGrid)" opacity="0.78"/>
    </g>

    <!-- Low central deck bridge and solar canopy -->
    <path d="M418 565C615 505 925 502 1163 565L1091 657C884 626 645 619 477 650Z" fill="#f6fbff" stroke="#ffffff" stroke-width="4"/>
    <path d="M472 557C651 521 907 520 1112 564L1055 625C860 598 663 592 515 619Z" fill="url(#solarBlue)" opacity="0.68" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M472 557C651 521 907 520 1112 564L1055 625C860 598 663 592 515 619Z" fill="url(#microGrid)" opacity="0.56"/>
    <path d="M601 530C730 498 895 500 1027 532L1004 561C860 538 719 536 624 559Z" fill="#1b3149" opacity="0.14"/>

    <!-- Battery packs seen through the semi-transparent deck -->
    <g opacity="0.78">
      <rect x="676" y="555" width="78" height="35" rx="8" fill="#24344f" stroke="#95f1d8" stroke-width="2"/>
      <rect x="770" y="548" width="90" height="38" rx="8" fill="#24344f" stroke="#d9c0ff" stroke-width="2"/>
      <rect x="877" y="557" width="76" height="34" rx="8" fill="#24344f" stroke="#aee8ff" stroke-width="2"/>
      <path d="M690 572H740M786 567H842M891 573H939" stroke="#fffbd8" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
    </g>

    <!-- Separable docking seams and latches -->
    <g>
      <path d="M432 606C488 628 548 650 606 673" fill="none" stroke="url(#glowLine)" stroke-width="7" stroke-linecap="round"/>
      <path d="M963 584C915 615 863 645 811 676" fill="none" stroke="url(#glowLine)" stroke-width="7" stroke-linecap="round"/>
      <rect x="575" y="633" width="42" height="16" rx="8" transform="rotate(21 596 641)" fill="#fff4ac" opacity="0.9"/>
      <rect x="879" y="623" width="42" height="16" rx="8" transform="rotate(-29 900 631)" fill="#fff4ac" opacity="0.9"/>
      <path d="M609 641L646 622M860 640L824 620" stroke="#29445f" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Warm rim light from the sunset -->
    <path d="M418 565C615 505 925 502 1163 565" fill="none" stroke="#ffe6a3" stroke-width="5" stroke-linecap="round" opacity="0.75"/>
    <path d="M757 620C875 571 1049 568 1185 603" fill="none" stroke="#ffe6a3" stroke-width="4" stroke-linecap="round" opacity="0.72"/>
    <path d="M294 631C402 581 572 573 710 598" fill="none" stroke="#ffe6a3" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Dream-sketch inset showing the same craft as a distant sunset silhouette -->
  <g transform="translate(96 86)">
    <rect x="0" y="0" width="405" height="236" rx="28" fill="#fff7e8" opacity="0.62" stroke="#ffffff" stroke-width="2"/>
    <rect x="28" y="33" width="350" height="9" fill="#d69bd4" opacity="0.5"/>
    <rect x="28" y="65" width="350" height="7" fill="#f0c075" opacity="0.56"/>
    <rect x="28" y="94" width="350" height="11" fill="#9290db" opacity="0.45"/>
    <circle cx="287" cy="117" r="38" fill="#ffd37a" opacity="0.75"/>
    <path d="M31 150C101 137 163 142 230 151C285 158 326 151 378 139V210H31Z" fill="#6a8399" opacity="0.48"/>
    <path d="M96 145C153 128 250 129 312 147L287 166C229 157 160 157 110 166Z" fill="#24344f" opacity="0.84"/>
    <path d="M78 166C119 151 176 150 218 163C194 177 108 181 65 170Z" fill="#24344f" opacity="0.78"/>
    <path d="M213 169C258 154 324 155 360 171C331 185 247 187 203 176Z" fill="#24344f" opacity="0.78"/>
    <path d="M96 145C153 128 250 129 312 147" fill="none" stroke="#ffe6a3" stroke-width="3" opacity="0.7"/>
    <text x="28" y="221" font-family="Inter, Arial, sans-serif" font-size="16" fill="#283a52" opacity="0.8">dream sunset thumbnail</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" fill="#20324a">
    <text x="70" y="914" font-size="30" font-weight="700">Modular solar catamaran concept</text>
    <text x="70" y="950" font-size="19" opacity="0.78">2-3 separable light hulls · semi-matte translucent solar skin · compact high-power battery packs · pastel retro sunset</text>
  </g>
</svg>
